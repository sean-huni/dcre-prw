# 12FactorApp: committed working dev defaults; env overrides. (yml-only rule, configuration.md p19)
spring:
  # SCRUM-42: shared per-client exchange layout (platform-batch autoconfigures ExchangeLayout from this).
  config:
    import: classpath:dcre-exchange-layout.yml
  threads:
    virtual:
      enabled: true
  datasource:
    # dcre_pay, NOT dcre_col: the payments split gives this family its own
    # database, and that database is now the family discriminator.
    url: ${DCRE_PAY_DB_URL:jdbc:postgresql://localhost:26257/dcre_pay?sslmode=disable}
    username: ${DCRE_PAY_DB_USER:root}
    password: ${DCRE_PAY_DB_PASSWORD:}
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    # Per-service migration history (same isolation idea as PRW_BATCH_)
    database-change-log-table: prw_databasechangelog
    database-change-log-lock-table: prw_databasechangeloglock

dcre:
  batch:
    table-prefix: PRW_BATCH_
  agtops-db-url: ${DCRE_AGTOPS_DB_URL:jdbc:postgresql://localhost:26257/agt_ops?sslmode=disable}
  agtops-db-user: ${DCRE_AGTOPS_DB_USER:root}
  agtops-db-password: ${DCRE_AGTOPS_DB_PASSWORD:}
  exchange-root: ${DCRE_EXCHANGE_ROOT:../../../../../../infra/dcre-infra/exchange}
  amount-scale: ${DCRE_AMOUNT_SCALE:2}
  prw:
    split:
      # SCRUM-55: max tx per outbound pain.008. Default 5000 (Sean 2026-07-16).
      # INTERIM home until the R-14 client reference table materializes (R-39).
      max-size: ${DCRE_PRW_MAX_SPLIT_SIZE:5000}
      # Per-client override map. It carries a REAL committed entry rather than
      # sitting absent, and that is deliberate: an absent map cannot distinguish
      # "no overrides configured" from "the yml key and the Java @ConfigurationProperties
      # prefix have drifted apart", which binds an EMPTY map, drops every client to
      # the constant default, and still exits 0. That failure has shipped three times
      # in this estate. SplitPropertiesBindingTest asserts this map is POPULATED from
      # the SHIPPED yml, so the drift is a red test rather than a silent default.
      # An inline empty {} breaks Boot map binding, so the key is never written empty.
      overrides:
        FNBRF01: ${DCRE_PRW_SPLIT_FNBRF01:5000}
